services:
  openmanus-sandbox-runner:
    build:
      context: .
      dockerfile: backend/sandbox_runner/Dockerfile.service
    image: openmanus-sandbox-runner:local
    container_name: openmanus-sandbox-runner
    environment:
      OPENMANUS_SANDBOX_TOKEN: ${OPENMANUS_SANDBOX_TOKEN:?Set OPENMANUS_SANDBOX_TOKEN to a long random value}
      OPENMANUS_SANDBOX_PROJECTS_ROOT: /workspace/projects
      OPENMANUS_SANDBOX_BIND: 0.0.0.0
      OPENMANUS_SANDBOX_PORT: "8765"
      OPENMANUS_SANDBOX_IMAGE: openmanus-code-runner:latest
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - openmanus-data:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - sandbox-control
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  openmanus-data:
    external: true

networks:
  sandbox-control:
    name: openmanus-sandbox-control
    external: true
