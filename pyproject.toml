[project]
name = "open-manus-platform"
version = "0.1.0"
description = "DeepSeek-controlled OpenManus platform foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=43,<51",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
